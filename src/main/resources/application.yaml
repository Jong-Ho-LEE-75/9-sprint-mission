# ===== 공통 설정 (모든 프로파일에 적용) =====
spring:
  application:
    name: discodeit
  profiles:
    active: dev  # 기본 활성 프로파일
  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 30MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # 스키마 자동 생성 안 함, schema.sql 수동 적용 필요
    defer-datasource-initialization: true
  sql:
    init:
      mode: never

# 파일 저장소 설정
discodeit:
  storage:
    type: local
    local:
      root-path: .discodeit-storage

# 기본 로깅 레벨
logging:
  level:
    root: info

# ===== Actuator 모니터링 설정 =====
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# 애플리케이션 정보 (Actuator /info 엔드포인트)
info:
  app:
    name: Discodeit
    version: 1.7.0
    java-version: 17
    spring-boot-version: 3.4.0
  config:
    datasource:
      url: ${spring.datasource.url}
      driver-class-name: ${spring.datasource.driver-class-name}
    jpa:
      ddl-auto: ${spring.jpa.hibernate.ddl-auto}
    storage:
      type: ${discodeit.storage.type}
      path: ${discodeit.storage.local.root-path}
    multipart:
      max-file-size: ${spring.servlet.multipart.maxFileSize}
      max-request-size: ${spring.servlet.multipart.maxRequestSize}
